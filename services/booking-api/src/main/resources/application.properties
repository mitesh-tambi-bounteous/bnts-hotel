spring.application.name=booking-api
management.endpoints.web.exposure.include=health,info
spring.jpa.hibernate.ddl-auto=none
spring.flyway.locations=classpath:db/migration
# Datasource settings come from the environment (SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD); see .env.example.
# Razorpay keys come from RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET only; blank is allowed except in qa and prod.
razorpay.key-id=
razorpay.key-secret=
