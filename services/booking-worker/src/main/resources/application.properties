spring.application.name=booking-worker
management.endpoints.web.exposure.include=health,info

# The worker reads and updates email_outbox only; use a DB role limited to that table (no DELETE).
# The connection comes only from SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and
# SPRING_DATASOURCE_PASSWORD (the same names as the API). There is no default, so a missing URL
# stops startup; localhost defaults live in application-local.properties.

# Blank sender address: log emails instead of sending (refused in the qa and prod profiles).
email.from-address=${SES_FROM_ADDRESS:}
email.region=ap-south-1
email.poll-interval-ms=10000
email.batch-size=10
email.lease-seconds=120
email.max-attempts=5
