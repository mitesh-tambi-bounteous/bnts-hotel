<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guest Web — app shell</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="prototype-utils.css">
  <style>
    .shell { min-height: 100vh; display: flex; flex-direction: column; }
    .shell-header { padding: var(--space-3); border-bottom: var(--border-width) solid var(--color-border); }
    .shell-brand { font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); color: var(--color-fg); text-decoration: none; }
    .shell-main { flex: 1; width: 100%; max-width: var(--size-content); margin-inline: auto; padding: var(--space-5) var(--space-3); }
    .shell-footer { padding: var(--space-3); border-top: var(--border-width) solid var(--color-border); color: var(--color-fg-muted); font-size: var(--font-size-sm); }
  </style>
</head>
<body>
  <div class="shell" data-arc-shell>
    <header class="shell-header">
      <a class="shell-brand" href="#">Guest Web</a>
    </header>
    <main class="shell-main">
      <div data-arc-content></div>
    </main>
    <footer class="shell-footer">Hotel guest web app</footer>
  </div>
</body>
</html>
