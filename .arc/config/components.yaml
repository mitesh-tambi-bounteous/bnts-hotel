version: 1
components:
  comp_guest_web_app:
    name: Guest Web App
    kind: web_ui
    directory: apps/guest-web
    stack:
      choices:
        styling: tailwindcss
        language: typescript
        framework: nextjs
        package_manager: pnpm
        testing_tool_e2e: playwright
        testing_tool_unit: vitest
      notes: Next.js for server-rendered, SEO-friendly hotel search; no own database
        (Booking API owns data)
  comp_staff_admin_app:
    name: Staff Admin App
    kind: web_ui
    directory: apps/staff-admin
    stack:
      choices:
        styling: tailwindcss
        language: typescript
        framework: react-vite
        package_manager: pnpm
        testing_tool_e2e: playwright
        testing_tool_unit: vitest
      notes: Staff-only SPA behind login; no SSR/SEO need, so Vite instead of Next.js;
        no own database
  comp_booking_api:
    name: Booking API
    kind: api_service
    directory: services/booking-api
    stack:
      choices:
        database: postgresql
        language: java
        framework: spring-boot
        package_manager: gradle
        testing_tool_e2e: rest-assured with testcontainers
        testing_tool_unit: junit5
      notes: Java 21; human chose Java/Spring Boot and Gradle; styling not applicable
        — API only
  comp_booking_worker:
    name: Booking Worker
    kind: worker
    directory: services/booking-worker
    stack:
      choices:
        language: java
        framework: spring-boot
        package_manager: gradle
        testing_tool_e2e: testcontainers
        testing_tool_unit: junit5
      notes: Java 21; matches Booking API to share the booking model; no web server;
        uses the API-owned PostgreSQL, owns no schema; e2e is integration tests against
        a PostgreSQL container
  comp_relational_database:
    name: Relational Database
    kind: managed_service
    stack:
      choices:
        managed_service: PostgreSQL on Amazon RDS (ap-south-1, Multi-AZ, automated
          backups)
